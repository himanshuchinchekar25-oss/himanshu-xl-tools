<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta
    http-equiv="X-UA-Compatible"
    content="IE=Edge"
  />

  <title>Export PowerPoint</title>

  <script
    src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"
  ></script>

  <style>
    body {
      font-family: "Segoe UI", Arial, sans-serif;
      margin: 0;
      padding: 24px;
      background: #f4f8fc;
      color: #172a3a;
    }

    .card {
      background: #ffffff;
      border: 1px solid #d6e2ee;
      border-radius: 10px;
      padding: 22px;
    }

    h2 {
      margin-top: 0;
      color: #0b4f93;
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 7px;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 10px;
      margin-bottom: 18px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
    }

    button {
      width: 100%;
      padding: 11px;
      border: 0;
      border-radius: 6px;
      background: #f57c00;
      color: white;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: default;
    }

    #status {
      margin-top: 16px;
      font-size: 13px;
    }

    .note {
      margin-top: 14px;
      font-size: 12px;
      color: #64748b;
    }
  </style>
</head>

<body>

  <div class="card">

    <h2>Export PowerPoint</h2>

    <label for="pptFileName">
      File Name
    </label>

    <input
      id="pptFileName"
      type="text"
      value="HimanshuXLTools_Dashboard"
    />

    <button
      id="exportPptBtn"
      type="button"
    >
      Export PPT
    </button>

    <div id="status">
      Ready to export.
    </div>

    <div class="note">
      Exports the Excel Dashboard as a professional 16:9 PowerPoint slide.
    </div>

  </div>

<script src="vendor/pptxgen.bundle.js"></script>



</body>
</html>
