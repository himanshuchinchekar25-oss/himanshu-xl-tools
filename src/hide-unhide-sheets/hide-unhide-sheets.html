<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=Edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Hide / Unhide Sheets</title>

  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px;
      font-family: "Segoe UI", Arial, sans-serif;
      background: #f5f7fb;
      color: #1f2937;
    }

    .container {
      max-width: 680px;
      margin: 0 auto;
    }

    .card {
      background: white;
      border-radius: 14px;
      padding: 24px;
      box-shadow: 0 4px 18px rgba(0,0,0,.08);
    }

    h1 {
      margin: 0 0 6px;
      font-size: 25px;
    }

    .subtitle {
      margin: 0 0 22px;
      color: #6b7280;
    }

    .sheet-list {
      display: flex;
      flex-direction: column;
      gap: 9px;
      margin-top: 12px;
    }

    .sheet-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      padding: 12px;
      border: 1px solid #e5e7eb;
      border-radius: 9px;
      background: #fafafa;
    }

    .sheet-name {
      font-weight: 600;
      word-break: break-word;
    }

    .sheet-control {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    select {
      min-width: 110px;
      padding: 8px 10px;
      border: 1px solid #d1d5db;
      border-radius: 7px;
      background: white;
    }

    .button-row {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    button {
      border: none;
      border-radius: 8px;
      padding: 11px 18px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    #refreshBtn {
      background: #e5e7eb;
      color: #111827;
    }

    #applyBtn {
      flex: 1;
      background: #217346;
      color: white;
    }

    #applyBtn:disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    #status {
      margin-top: 18px;
      padding: 12px;
      min-height: 44px;
      border-radius: 8px;
      background: #f3f4f6;
      line-height: 20px;
      font-size: 14px;
    }

    .note {
      margin-top: 15px;
      color: #6b7280;
      font-size: 12px;
      line-height: 18px;
    }
  </style>
</head>

<body>

  <div class="container">
    <div class="card">

      <h1>Hide / Unhide Sheets</h1>

      <p class="subtitle">
        Control worksheet visibility in the current workbook.
      </p>

      <div id="sheetList" class="sheet-list">
        Reading workbook sheets...
      </div>

      <div class="button-row">

        <button id="refreshBtn" type="button">
          Refresh
        </button>

        <button id="applyBtn" type="button" disabled>
          Apply Changes
        </button>

      </div>

      <div id="status">
        Reading workbook...
      </div>

      <div class="note">
        Excel requires at least one worksheet to remain visible.
      </div>

    </div>
  </div>

</body>
</html>
