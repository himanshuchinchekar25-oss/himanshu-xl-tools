<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=Edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Fill Blanks</title>

  <script
    src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js">
  </script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px;
      font-family: "Segoe UI", Arial, sans-serif;
      background: #f5f7fb;
      color: #1f2937;
    }

    .container {
      max-width: 680px;
      margin: 0 auto;
    }

    .card {
      background: #ffffff;
      border-radius: 14px;
      padding: 24px;
      box-shadow: 0 4px 18px rgba(0,0,0,.08);
    }

    h1 {
      margin: 0 0 6px;
      font-size: 25px;
    }

    .subtitle {
      margin: 0 0 22px;
      color: #6b7280;
      line-height: 20px;
    }

    .section {
      margin-bottom: 20px;
    }

    .label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
    }

    .range-row,
    .method-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .option-card {
      display: block;
      padding: 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      background: #fafafa;
      cursor: pointer;
    }

    .option-card input {
      margin-right: 7px;
    }

    .option-title {
      font-weight: 600;
    }

    .option-help {
      display: block;
      margin-top: 5px;
      margin-left: 23px;
      color: #6b7280;
      font-size: 12px;
      line-height: 17px;
    }

    input[type="text"] {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      background: #ffffff;
      font-size: 14px;
    }

    input[type="text"]:focus {
      outline: none;
      border-color: #217346;
    }

    #valueSection,
    #formulaSection {
      margin-top: 14px;
    }

    .button-row {
      display: flex;
      gap: 10px;
      margin-top: 22px;
    }

    button {
      border: none;
      border-radius: 8px;
      padding: 11px 18px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    #refreshBtn {
      background: #e5e7eb;
      color: #111827;
    }

    #fillBtn {
      flex: 1;
      background: #217346;
      color: #ffffff;
    }

    #fillBtn:disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    #status {
      margin-top: 18px;
      padding: 12px;
      min-height: 44px;
      border-radius: 8px;
      background: #f3f4f6;
      font-size: 14px;
      line-height: 20px;
      white-space: pre-line;
    }

    .note {
      margin-top: 14px;
      color: #6b7280;
      font-size: 12px;
      line-height: 18px;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="card">

      <h1>Fill Blanks</h1>

      <p class="subtitle">
        Fill empty cells in the selected range or active worksheet using a value,
        nearby cell, or formula.
      </p>


      <!-- RANGE -->

      <div class="section">

        <div class="label">
          Fill Range
        </div>

        <div class="range-row">

          <label class="option-card">
            <input
              type="radio"
              name="fillRange"
              value="selection"
              checked
            >
            <span class="option-title">
              Selected Range
            </span>

            <span class="option-help">
              Fill blanks only inside the current Excel selection.
            </span>
          </label>


          <label class="option-card">
            <input
              type="radio"
              name="fillRange"
              value="usedRange"
            >
            <span class="option-title">
              Used Range
            </span>

            <span class="option-help">
              Fill blanks inside the active worksheet used range.
            </span>
          </label>

        </div>

      </div>


      <!-- METHOD -->

      <div class="section">

        <div class="label">
          Fill Method
        </div>

        <div class="method-grid">

          <label class="option-card">
            <input
              type="radio"
              name="fillMethod"
              value="fixed"
              checked
            >
            <span class="option-title">
              Fixed Value
            </span>

            <span class="option-help">
              Example: 0, N/A, Pending
            </span>
          </label>


          <label class="option-card">
            <input
              type="radio"
              name="fillMethod"
              value="above"
            >
            <span class="option-title">
              Value Above
            </span>

            <span class="option-help">
              Use the nearest filled value above each blank.
            </span>
          </label>


          <label class="option-card">
            <input
              type="radio"
              name="fillMethod"
              value="below"
            >
            <span class="option-title">
              Value Below
            </span>

            <span class="option-help">
              Use the nearest filled value below each blank.
            </span>
          </label>


          <label class="option-card">
            <input
              type="radio"
              name="fillMethod"
              value="formula"
            >
            <span class="option-title">
              Formula
            </span>

            <span class="option-help">
              Put the same Excel formula into blank cells.
            </span>
          </label>

        </div>

      </div>


      <!-- FIXED VALUE -->

      <div
        id="valueSection"
        class="section">

        <label
          class="label"
          for="fillValueInput">
          Fill Value
        </label>

        <input
          id="fillValueInput"
          type="text"
          placeholder="Example: 0, N/A, Pending"
        >

      </div>


      <!-- FORMULA -->

      <div
        id="formulaSection"
        class="section"
        style="display:none;">

        <label
          class="label"
          for="formulaInput">
          Formula
        </label>

        <input
          id="formulaInput"
          type="text"
          placeholder="Example: =TODAY()"
        >

        <div class="note">
          Enter a valid Excel formula beginning with =.
        </div>

      </div>


      <!-- BUTTONS -->

      <div class="button-row">

        <button
          id="refreshBtn"
          type="button">
          Refresh
        </button>

        <button
          id="fillBtn"
          type="button"
          disabled>
          Fill Blanks
        </button>

      </div>


      <div id="status">
        Reading workbook...
      </div>


      <div class="note">
        Only genuinely empty cells are filled. Existing cell values are preserved.
      </div>

    </div>

  </div>

</body>
</html>
