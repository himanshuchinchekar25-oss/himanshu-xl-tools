<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=Edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Copy / Move Sheet</title>

  <script
    src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js">
  </script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px;
      font-family: "Segoe UI", Arial, sans-serif;
      background: #f5f7fb;
      color: #1f2937;
    }

    .container {
      max-width: 680px;
      margin: 0 auto;
    }

    .card {
      background: white;
      border-radius: 14px;
      padding: 24px;
      box-shadow: 0 4px 18px rgba(0,0,0,.08);
    }

    h1 {
      margin: 0 0 6px;
      font-size: 25px;
    }

    .subtitle {
      margin: 0 0 22px;
      color: #6b7280;
    }

    .section {
      margin-bottom: 18px;
    }

    .label {
      display: block;
      margin-bottom: 7px;
      font-weight: 600;
    }

    select,
    input[type="text"] {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 14px;
      background: white;
    }

    .mode-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .mode-option {
      padding: 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      background: #fafafa;
    }

    .mode-option input {
      margin-right: 7px;
    }

    .button-row {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    button {
      border: none;
      border-radius: 8px;
      padding: 11px 18px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    #refreshBtn {
      background: #e5e7eb;
      color: #111827;
    }

    #applyBtn {
      flex: 1;
      background: #217346;
      color: white;
    }

    #applyBtn:disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    #status {
      margin-top: 18px;
      padding: 12px;
      min-height: 44px;
      border-radius: 8px;
      background: #f3f4f6;
      font-size: 14px;
      line-height: 20px;
    }

    .note {
      margin-top: 14px;
      color: #6b7280;
      font-size: 12px;
      line-height: 18px;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="card">

      <h1>Copy / Move Sheet</h1>

      <p class="subtitle">
        Copy a worksheet or move it to another position in the current workbook.
      </p>


      <div class="section">

        <label
          class="label"
          for="sourceSheetSelect">
          Source Worksheet
        </label>

        <select id="sourceSheetSelect">
          <option value="">
            Loading worksheets...
          </option>
        </select>

      </div>


      <div class="section">

        <div class="label">
          Action
        </div>

        <div class="mode-row">

          <label class="mode-option">
            <input
              type="radio"
              name="copyMoveMode"
              value="copy"
              checked
            >
            Copy Sheet
          </label>

          <label class="mode-option">
            <input
              type="radio"
              name="copyMoveMode"
              value="move"
            >
            Move Sheet
          </label>

        </div>

      </div>


      <div class="section">

        <label
          class="label"
          for="positionSelect">
          Position
        </label>

        <select id="positionSelect">
          <option value="end">
            Move / Copy to End
          </option>
          <option value="before">
            Before Worksheet
          </option>
          <option value="after">
            After Worksheet
          </option>
        </select>

      </div>


      <div
        id="targetSheetSection"
        class="section"
        style="display:none;">

        <label
          class="label"
          for="targetSheetSelect">
          Target Worksheet
        </label>

        <select id="targetSheetSelect"></select>

      </div>


      <div
        id="newNameSection"
        class="section">

        <label
          class="label"
          for="newNameInput">
          New Sheet Name
        </label>

        <input
          id="newNameInput"
          type="text"
          maxlength="31"
          placeholder="Example: Sales_Copy"
        >

      </div>


      <div class="button-row">

        <button
          id="refreshBtn"
          type="button">
          Refresh
        </button>

        <button
          id="applyBtn"
          type="button"
          disabled>
          Copy Sheet
        </button>

      </div>


      <div id="status">
        Reading workbook...
      </div>


      <div class="note">
        Copy creates a new worksheet. Move only changes the position of the existing worksheet.
      </div>

    </div>

  </div>

</body>
</html>
